name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n scripts/check-no-secrets.sh

      - name: Check for accidental secrets
        run: scripts/check-no-secrets.sh

      - name: Verify example config loads
        run: |
          set -a
          source config.example.env
          set +a
          test -n "$VPN_HOST"
          test -n "$WG_PORT"
          test -n "$OVPN_PORT"

      - name: Check dry-run plan on Ubuntu 24.04
        run: ./bootstrap.sh --dry-run --config config.example.env
